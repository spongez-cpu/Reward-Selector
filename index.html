<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Reward Selector</title>

    <!-- PWA TAGS -->
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#2ecc71">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Study Rewards">
    <link rel="apple-touch-icon" href="IMG_2096.png">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 { color: #333; margin-top: 0; font-size: 1.5rem; }

        .input-area { display: flex; gap: 10px; margin-bottom: 20px; }

        input {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover { opacity: 0.9; }

        /* --- PROFILE SCREEN --- */
        #profile-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            width: 100%;
        }
        .profile-input { width: 100%; margin-bottom: 15px; padding: 12px; box-sizing: border-box; text-align: center; font-size: 18px;}
        
        /* --- MAIN APP --- */
        #app-screen { display: none; width: 100%; flex-direction: column; align-items: center; }
        .top-bar {
            width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; background: white; padding: 10px 20px; border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); box-sizing: border-box;
        }
        .top-bar span { font-weight: bold; color: #333; }
        .logout-btn { background: #95a5a6; font-size: 12px; padding: 8px 12px; }

        /* Unified Timer Styles */
        .stats-box {
            background: #e8f8f5; border: 2px solid #1abc9c; padding: 15px; border-radius: 8px;
            margin-bottom: 20px; font-size: 18px; color: #16a085; font-weight: bold;
        }
        .override-btn {
            background-color: #f39c12; padding: 8px 14px; font-size: 14px; width: 100%; margin-top: 10px;
        }
        .override-btn:hover { background-color: #d68910; }

        .timer-display {
            font-size: 36px; font-weight: bold; color: #333; margin: 15px 0; font-family: monospace;
        }
        .timer-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .timer-buttons button { flex: 1; }
        #stop-timer-btn { background-color: #e74c3c; }
        #stop-timer-btn:hover { background-color: #c0392b; }

        .subject-selector-row {
            display: flex; gap: 10px; margin-bottom: 15px; background: #fdf2e9; padding: 15px;
            border-radius: 8px; border: 2px solid #e67e22;
        }
        .subject-selector-row select {
            flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 6px; font-size: 16px; background-color: white; cursor: pointer;
        }
        .add-subject-btn { background-color: #3498db; padding: 10px 15px; white-space: nowrap; }

        ul { list-style: none; padding: 0; text-align: left; }
        li {
            background: #f9f9f9; padding: 12px; margin-bottom: 8px; border-radius: 6px;
            display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #3498db;
        }
        .delete-btn { background-color: #e74c3c; padding: 5px 10px; font-size: 12px; }
        .delete-btn:hover { background-color: #c0392b; }

        /* Spinner */
        .spinner-box { display: flex; flex-direction: column; gap: 10px; margin: 20px 0; padding: 12px; background: #fafafa; border-radius: 8px; border: 3px solid #3498db; }
        .spinner-item { background: white; border: 2px solid #ddd; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; color: #333; text-align: center; transition: all 0.1s ease; }
        .spinner-item.active { border: 3px solid #3498db; background-color: #ebf5fb; color: #2980b9; transform: scale(1.02); box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); }
        #spin-btn { background-color: #9b59b6; width: 100%; margin-top: 5px; }
        #spin-btn:hover { background-color: #8e44ad; }
        #result { font-weight: bold; color: #8e44ad; margin-top: 15px; font-size: 18px; }

        .reset-buttons-group { display: flex; gap: 10px; margin-top: 10px; }
        .reset-data-btn, .reset-coins-btn { flex: 1; font-size: 12px; padding: 8px 10px; border-radius: 6px; }
        .reset-coins-btn { background-color: #f39c12; }
        .reset-coins-btn:hover { background-color: #d68910; }
        .reset-data-btn { background-color: #95a5a6; }
        .reset-data-btn:hover { background-color: #7f8c8d; }

        .subject-hours { color: #e67e22; font-size: 13px; font-weight: bold; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; text-align: center; }
        
        /* Loading Overlay */
        #loading-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8); z-index: 1000; justify-content: center; align-items: center; font-size: 20px; font-weight: bold; color: #2ecc71;
        }
    </style>
</head>

<body>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay">Syncing with Cloud... ☁️</div>

    <!-- PROFILE SELECTION SCREEN -->
    <div id="profile-screen">
        <div class="container">
            <h1>Who's Studying? 👤</h1>
            <p style="color: #666; font-size: 14px; margin-bottom: 20px;">Enter your username to sync your data across devices.</p>
            <input type="text" id="username-input" class="profile-input" placeholder="Username" autocomplete="off" onkeypress="handleEnter(event)">
            <button onclick="loadProfile()" style="width: 100%; padding: 12px;">Enter / Sync</button>
            <p id="sync-error" style="color: #e74c3c; font-size: 13px; margin-top: 15px;"></p>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen">
        <div class="top-bar">
            <span>👤 <span id="username-display"></span></span>
            <button class="logout-btn" onclick="logoutProfile()">Switch User</button>
        </div>

        <!-- UNIFIED TIMER -->
        <div class="container">
            <h1>Study Timer ⏱️</h1>
            
            <div class="stats-box">
                Coins Available: <span id="coin-count">0</span> 🪙<br>
                <span style="font-size: 14px; color: #666; font-weight: normal;">Total Hours Studied: <span id="total-hours">0</span>h</span>
                <div>
                    <button class="override-btn" onclick="claimOverrideCoin()">Already did one? +1 Coin 🪙</button>
                </div>
            </div>

            <div class="subject-selector-row">
                <select id="subject-dropdown" onchange="changeSubject()">
                    <option value="-1">General Study (No Subject)</option>
                </select>
                <button class="add-subject-btn" onclick="openSubjectModal()">+ Add</button>
            </div>

            <div class="timer-display" id="timer-display">00:00:00</div>

            <div class="timer-buttons">
                <button id="start-timer-btn" onclick="toggleTimer()">Start Study</button>
                <button id="stop-timer-btn" onclick="stopAndClaimTimer()">Finish & Claim</button>
            </div>
            <p style="font-size: 13px; color: #666; margin-top: 5px;">(1 Hour studied = 1 Reward Coin)</p>

            <ul id="subject-list" style="margin-top: 25px; font-size: 14px;"></ul>
        </div>

        <!-- REWARDS -->
        <div class="container">
            <h1>Reward Menu 🎁</h1>
            <div class="input-area">
                <input type="text" id="reward-input" placeholder="Add reward (e.g., 15m YouTube)">
                <button onclick="addReward()" style="background-color: #3498db;">Add</button>
            </div>
            <ul id="reward-list"></ul>
        </div>

        <!-- SPINNER -->
        <div class="container">
            <h1>Spin for Rewards! 🎰</h1>
            <p>Cost to spin: <strong>1 Coin</strong></p>
            <div class="spinner-box" id="spinner-box"></div>
            <button id="spin-btn" onclick="spinWheel()">Spin the List! (-1 Coin)</button>
            <div id="result"></div>
            <div class="reset-buttons-group">
                <button class="reset-coins-btn" onclick="resetCoinsOnly()">Reset Coins (0)</button>
                <button class="reset-data-btn" onclick="resetData()">Reset All Data</button>
            </div>
        </div>
    </div>

    <!-- ADD SUBJECT MODAL -->
    <div class="modal" id="subject-modal">
        <div class="modal-content">
            <h2 style="margin-top: 0; color: #333;">Add Subject</h2>
            <input type="text" id="new-subject-input" placeholder="e.g. ECE2072" style="width: 100%; box-sizing: border-box; margin-bottom: 15px;">
            <div style="display: flex; gap: 10px;">
                <button onclick="closeSubjectModal()" style="background-color: #95a5a6; flex: 1;">Cancel</button>
                <button onclick="confirmAddSubject()" style="flex: 1;">Add</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 1. PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- STATE ---
        let currentUser = "";
        let studyCoins = 0;
        let totalHoursStudied = 0;
        let rewards = [];
        let units = [];
        
        let secondsElapsed = 0;
        let timerInterval = null;
        let isStudying = false;
        let isSpinning = false;
        let activeUnitIndex = -1; 

        // --- AUTH / PROFILE LOGIC ---
        window.handleEnter = (e) => { if (e.key === "Enter") loadProfile(); };

        window.loadProfile = async () => {
            const input = document.getElementById("username-input").value.trim();
            if (!input) return alert("Please enter a username.");
            
            // Sanitize username for database document ID (no spaces/special chars)
            currentUser = input.toLowerCase().replace(/[^a-z0-9]/g, ""); 
            
            if (!currentUser) return alert("Username must contain letters or numbers.");

            // Show loading
            document.getElementById("loading-overlay").style.display = "flex";
            document.getElementById("sync-error").innerText = "";

            try {
                const docRef = doc(db, "profiles", currentUser);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    studyCoins = data.studyCoins || 0;
                    totalHoursStudied = data.totalHoursStudied || 0;
                    rewards = data.rewards || [];
                    units = data.units || [];
                } else {
                    // New user profile
                    studyCoins = 0;
                    totalHoursStudied = 0;
                    rewards = [];
                    units = [];
                    await saveData();
                }

                // Update UI
                document.getElementById("username-display").innerText = input;
                document.getElementById("profile-screen").style.display = "none";
                document.getElementById("app-screen").style.display = "flex";
                
                activeUnitIndex = -1;
                updateUI();
            } catch (error) {
                document.getElementById("sync-error").innerText = "Error connecting to database. Check your config.";
                console.error(error);
            } finally {
                document.getElementById("loading-overlay").style.display = "none";
            }
        };

        window.logoutProfile = () => {
            if (isStudying) {
                if (!confirm("Timer is running. Are you sure you want to switch users?")) return;
                clearInterval(timerInterval);
            }
            currentUser = "";
            document.getElementById("username-input").value = "";
            document.getElementById("app-screen").style.display = "none";
            document.getElementById("profile-screen").style.display = "flex";
        };

        // --- DATABASE SYNC ---
        async function saveData() {
            if (!currentUser) return;
            try {
                await setDoc(doc(db, "profiles", currentUser), {
                    studyCoins: studyCoins,
                    totalHoursStudied: totalHoursStudied,
                    rewards: rewards,
                    units: units
                });
            } catch (e) {
                console.error("Error saving data:", e);
            }
        }

        // --- TIMER LOGIC ---
        window.toggleTimer = () => {
            const btn = document.getElementById("start-timer-btn");
            if (!isStudying) {
                isStudying = true;
                btn.innerText = "Pause";
                btn.style.backgroundColor = "#e67e22";
                document.getElementById("subject-dropdown").disabled = true;
                
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
            } else {
                isStudying = false;
                btn.innerText = "Resume";
                btn.style.backgroundColor = "#2ecc71";
                clearInterval(timerInterval);
            }
        };

        window.stopAndClaimTimer = () => {
            if (secondsElapsed === 0) return;
            clearInterval(timerInterval);
            isStudying = false;
            document.getElementById("start-timer-btn").innerText = "Start Study";
            document.getElementById("start-timer-btn").style.backgroundColor = "#2ecc71";
            document.getElementById("subject-dropdown").disabled = false;

            const hoursEarned = secondsElapsed / 3600;
            
            studyCoins += hoursEarned;
            totalHoursStudied += hoursEarned;

            if (activeUnitIndex !== -1 && units[activeUnitIndex]) {
                units[activeUnitIndex].hours += hoursEarned;
            }

            secondsElapsed = 0;
            updateTimerDisplay();
            saveData();
            updateUI();
        };

        function updateTimerDisplay() {
            const hrs = Math.floor(secondsElapsed / 3600).toString().padStart(2, '0');
            const mins = Math.floor((secondsElapsed % 3600) / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById("timer-display").innerText = `${hrs}:${mins}:${secs}`;
        }

        window.changeSubject = () => {
            const dropdown = document.getElementById("subject-dropdown");
            activeUnitIndex = parseInt(dropdown.value);
        };

        // --- MODAL LOGIC ---
        window.openSubjectModal = () => {
            if (isStudying) {
                alert("Please pause or finish the timer before adding a subject.");
                return;
            }
            document.getElementById("new-subject-input").value = "";
            document.getElementById("subject-modal").style.display = "flex";
            document.getElementById("new-subject-input").focus();
        };

        window.closeSubjectModal = () => {
            document.getElementById("subject-modal").style.display = "none";
        };

        window.confirmAddSubject = () => {
            const text = document.getElementById("new-subject-input").value.trim();
            if (text !== "") {
                units.push({ name: text, hours: 0 });
                closeSubjectModal();
                saveData();
                updateUI();
                document.getElementById("subject-dropdown").value = units.length - 1;
                activeUnitIndex = units.length - 1;
            }
        };

        // --- SUBJECT LIST ---
        window.deleteUnit = (index, event) => {
            event.stopPropagation();
            if (activeUnitIndex === index) {
                if (isStudying) stopAndClaimTimer(); 
                activeUnitIndex = -1;
                document.getElementById("subject-dropdown").value = "-1";
            } else if (activeUnitIndex > index) {
                activeUnitIndex--;
            }
            units.splice(index, 1);
            saveData();
            updateUI();
        };

        // --- REWARDS ---
        window.addReward = () => {
            const input = document.getElementById("reward-input");
            const text = input.value.trim();
            if (text !== "") {
                rewards.push(text);
                input.value = "";
                saveData();
                updateUI();
            }
        };

        window.deleteReward = (index) => {
            rewards.splice(index, 1);
            saveData();
            updateUI();
        };

        window.claimOverrideCoin = () => {
            studyCoins += 1;
            saveData();
            updateUI();
            document.getElementById("result").innerText = "✅ Override used: +1 coin";
        };

        // --- UI UPDATE ---
        function updateUI() {
            document.getElementById("coin-count").innerText = studyCoins.toFixed(2);
            document.getElementById("total-hours").innerText = totalHoursStudied.toFixed(2);

            // Update Dropdown
            const dropdown = document.getElementById("subject-dropdown");
            dropdown.innerHTML = '<option value="-1">General Study (No Subject)</option>';
            units.forEach((unit, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.innerText = unit.name;
                if (index === activeUnitIndex) option.selected = true;
                dropdown.appendChild(option);
            });

            // Update Subject List below timer
            const subjectList = document.getElementById("subject-list");
            subjectList.innerHTML = "";
            units.forEach((unit, index) => {
                const li = document.createElement("li");
                li.style.borderLeftColor = "#e67e22";
                li.innerHTML = `
                    <span>${unit.name}</span>
                    <span>
                        <span class="subject-hours">${unit.hours.toFixed(2)}h</span>
                        <button class="delete-btn" onclick="deleteUnit(${index}, event)" style="margin-left: 10px;">X</button>
                    </span>
                `;
                subjectList.appendChild(li);
            });

            // Update Rewards List
            const list = document.getElementById("reward-list");
            list.innerHTML = "";
            rewards.forEach((reward, index) => {
                const li = document.createElement("li");
                li.innerHTML = `${reward} <button class="delete-btn" onclick="deleteReward(${index})">Delete</button>`;
                list.appendChild(li);
            });

            updateSpinnerUI();
        }

        // --- SPINNER ---
        function updateSpinnerUI(activeIndex = -1) {
            const spinnerBox = document.getElementById("spinner-box");
            spinnerBox.innerHTML = "";
            if (rewards.length === 0) {
                spinnerBox.innerHTML = "<p style='color: #888;'>No rewards added yet!</p>";
                return;
            }
            rewards.forEach((reward, index) => {
                const div = document.createElement("div");
                div.className = "spinner-item" + (index === activeIndex ? " active" : "");
                div.innerText = reward;
                spinnerBox.appendChild(div);
            });
        }

        window.spinWheel = () => {
            if (isSpinning) return;
            if (studyCoins < 1) {
                alert("Not enough coins! Study more to earn coins.");
                return;
            }
            if (rewards.length === 0) {
                alert("Add some rewards to the menu first!");
                return;
            }

            studyCoins -= 1;
            saveData();
            updateUI();

            isSpinning = true;
            document.getElementById("result").innerText = "Selecting a reward...";

            const winningIndex = Math.floor(Math.random() * rewards.length);
            let currentIndex = 0;
            let totalSteps = rewards.length * 3 + winningIndex;
            let speed = 60;
            let step = 0;

            function animateSpin() {
                updateSpinnerUI(currentIndex);
                currentIndex = (currentIndex + 1) % rewards.length;
                step++;

                if (step < totalSteps) {
                    if (step > totalSteps - 12) speed += 35;
                    setTimeout(animateSpin, speed);
                } else {
                    updateSpinnerUI(winningIndex);
                    document.getElementById("result").innerText = `🎉 Reward Won: ${rewards[winningIndex]}!`;
                    isSpinning = false;
                }
            }
            animateSpin();
        };

        // --- RESET ---
        window.resetCoinsOnly = () => {
            studyCoins = 0;
            saveData();
            updateUI();
            document.getElementById("result").innerText = "Coins reset to 0!";
        };

        window.resetData = () => {
            if (confirm("Are you sure you want to reset all data and coins for this user?")) {
                studyCoins = 0;
                totalHoursStudied = 0;
                rewards = [];
                units = [];
                saveData();
                updateUI();
            }
        };

        // PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
