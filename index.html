<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Reward Selector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #2c3e50;
            font-size: 1.6rem;
            margin: 0 0 6px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin: 0 0 20px;
        }

        /* ---- Add reward row ---- */
        .add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .add-row input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            font-size: 0.95rem;
            font-family: inherit;
        }

        .add-row input:focus {
            outline: none;
            border-color: #3498db;
        }

        .add-row button {
            padding: 10px 16px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
        }

        .add-row button:hover {
            background: #2980b9;
        }

        /* ---- Reward selector ---- */
        .rewards {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .reward {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px 14px;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.15s, background 0.15s;
        }

        .reward:hover {
            border-color: #3498db;
        }

        .reward.selected {
            background: #e8f4fd;
            border-color: #3498db;
        }

        .reward .check {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid #bdc3c7;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #fff;
        }

        .reward.selected .check {
            background: #3498db;
            border-color: #3498db;
        }

        .reward .label {
            flex: 1;
            font-size: 0.95rem;
            color: #34495e;
        }

        .reward .remove {
            background: none;
            border: none;
            color: #bdc3c7;
            font-size: 1rem;
            cursor: pointer;
            padding: 0 4px;
        }

        .reward .remove:hover {
            color: #e74c3c;
        }

        .empty-note {
            color: #95a5a6;
            font-size: 0.85rem;
            padding: 10px 0;
        }

        /* ---- Selection result ---- */
        .chosen {
            min-height: 24px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #27ae60;
            margin-bottom: 8px;
        }

        /* ---- Override section ---- */
        .override-box {
            border-top: 1px dashed #dfe6e9;
            margin-top: 20px;
            padding-top: 18px;
        }

        .override-box h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #95a5a6;
            margin: 0 0 12px;
        }

        .coin-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #fff8e1;
            border: 2px solid #ffd54f;
            border-radius: 10px;
            padding: 10px 16px;
            margin-bottom: 12px;
            font-weight: 600;
            color: #b8860b;
        }

        .coin-row .coin-count {
            font-size: 1.3rem;
            color: #e67e22;
        }

        .override-btn {
            width: 100%;
            padding: 11px;
            background: #fff;
            border: 2px solid #e67e22;
            color: #e67e22;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }

        .override-btn:hover {
            background: #e67e22;
            color: #fff;
        }

        .override-btn:disabled {
            border-color: #bdc3c7;
            color: #bdc3c7;
            background: #f8f9fa;
            cursor: not-allowed;
        }

        .message {
            min-height: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 10px;
            color: #27ae60;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .message.show {
            opacity: 1;
        }

        .message.error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Study Reward Selector</h1>
        <p class="subtitle">Add your rewards, then pick the one you've earned.</p>

        <!-- Primary feature: add + select rewards -->
        <div class="add-row">
            <input type="text" id="rewardInput" placeholder="e.g. 20 min of gaming"
                   maxlength="60" autocomplete="off">
            <button id="addBtn">Add</button>
        </div>

        <div class="rewards" id="rewards"></div>

        <div class="chosen" id="chosen"></div>

        <!-- Optional override feature -->
        <div class="override-box">
            <h2>Already did it? Override</h2>
            <div class="coin-row">
                <span>🪙</span>
                <span>Coins:</span>
                <span class="coin-count" id="coinCount">0</span>
            </div>
            <button class="override-btn" id="overrideBtn" disabled>
                Override selected reward (+1 coin)
            </button>
            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'studyRewardSelector';
        const COIN_PER_OVERRIDE = 1;

        // State
        let state = loadState();

        // DOM
        const rewardsEl   = document.getElementById('rewards');
        const chosenEl    = document.getElementById('chosen');
        const inputEl     = document.getElementById('rewardInput');
        const addBtn      = document.getElementById('addBtn');
        const overrideBtn = document.getElementById('overrideBtn');
        const coinCountEl = document.getElementById('coinCount');
        const messageEl   = document.getElementById('message');

        let messageTimer = null;

        /* ---------- persistence ---------- */
        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const p = JSON.parse(raw);
                    if (p && Array.isArray(p.rewards)) {
                        return {
                            rewards: p.rewards,
                            selectedId: p.selectedId || null,
                            coins: Number(p.coins) || 0,
                            overridden: p.overridden || {}
                        };
                    }
                }
            } catch (e) { /* ignore corrupt data */ }
            return { rewards: [], selectedId: null, coins: 0, overridden: {} };
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) { /* ignore */ }
        }

        /* ---------- rendering ---------- */
        function render() {
            coinCountEl.textContent = state.coins;
            rewardsEl.innerHTML = '';

            if (state.rewards.length === 0) {
                const note = document.createElement('div');
                note.className = 'empty-note';
                note.textContent = 'No rewards yet — add one above.';
                rewardsEl.appendChild(note);
            }

            state.rewards.forEach(reward => {
                const isSelected = state.selectedId === reward.id;
                const row = document.createElement('div');
                row.className = 'reward' + (isSelected ? ' selected' : '');

                // Select area (click to select)
                const check = document.createElement('span');
                check.className = 'check';
                check.textContent = isSelected ? '✔' : '';

                const label = document.createElement('span');
                label.className = 'label';
                label.textContent = reward.label;

                row.appendChild(check);
                row.appendChild(label);

                // Remove button
                const remove = document.createElement('button');
                remove.className = 'remove';
                remove.textContent = '✕';
                remove.title = 'Remove reward';
                remove.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeReward(reward.id);
                });
                row.appendChild(remove);

                // Clicking the row selects the reward
                row.addEventListener('click', () => selectReward(reward.id));

                rewardsEl.appendChild(row);
            });

            // Selected result text
            const selected = state.rewards.find(r => r.id === state.selectedId);
            chosenEl.textContent = selected ? `Selected: ${selected.label}` : '';

            // Override button state
            const alreadyOverridden = selected && state.overridden[selected.id];
            if (!selected) {
                overrideBtn.disabled = true;
                overrideBtn.textContent = 'Override selected reward (+1 coin)';
            } else if (alreadyOverridden) {
                overrideBtn.disabled = true;
                overrideBtn.textContent = '✔ Override already used';
            } else {
                overrideBtn.disabled = false;
                overrideBtn.textContent = 'Override selected reward (+1 coin)';
            }
        }

        /* ---------- actions ---------- */
        function addReward() {
            const label = inputEl.value.trim();
            if (!label) {
                showMessage('Enter a reward first.', true);
                return;
            }
            const id = 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
            state.rewards.push({ id, label });
            state.selectedId = id; // auto-select the new one
            inputEl.value = '';
            saveState();
            render();
            showMessage(`Added reward: "${label}"`);
        }

        function selectReward(id) {
            state.selectedId = id;
            saveState();
            render();
        }

        function removeReward(id) {
            state.rewards = state.rewards.filter(r => r.id !== id);
            if (state.selectedId === id) state.selectedId = null;
            delete state.overridden[id];
            saveState();
            render();
        }

        function overrideSelected() {
            const selected = state.rewards.find(r => r.id === state.selectedId);
            if (!selected) return;
            if (state.overridden[selected.id]) {
                showMessage('Override already used for this reward.', true);
                return;
            }
            state.overridden[selected.id] = true;
            state.coins += COIN_PER_OVERRIDE;
            saveState();
            render();
            showMessage(`Override! +${COIN_PER_OVERRIDE} coin for "${selected.label}"`);
        }

        /* ---------- helpers ---------- */
        function showMessage(text, isError = false) {
            messageEl.textContent = text;
            messageEl.classList.toggle('error', isError);
            messageEl.classList.add('show');
            if (messageTimer) clearTimeout(messageTimer);
            messageTimer = setTimeout(() => messageEl.classList.remove('show'), 2200);
        }

        /* ---------- init ---------- */
        addBtn.addEventListener('click', addReward);
        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') addReward();
        });
        overrideBtn.addEventListener('click', overrideSelected);

        render();
    </script>
</body>
</html>
